<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Business Card & Scanner — LIFF</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="glass-container">
    
    <!-- Profile Header Section -->
    <header class="profile-header">
      <div class="avatar-wrapper">
        <img id="user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=250" alt="User Profile" />
        <div class="online-indicator"></div>
      </div>
      <h1 class="welcome-text">สวัสดี, <span id="user-display-name">Guest</span> 👋</h1>
      <p id="liff-status" class="status-badge">กำลังเชื่อมต่อ LINE...</p>
    </header>

    <div class="main-content">
      <!-- Section 1: Create Dynamic Business Card -->
      <section class="card-section glass-panel">
        <div class="panel-header">
          <span class="panel-icon">💳</span>
          <h2>สร้างนามบัตรของฉัน (Dynamic Card)</h2>
        </div>
        
        <div class="form-group">
          <label for="student-id">รหัสนักศึกษา (Student ID)</label>
          <input type="text" id="student-id" placeholder="ระบุรหัสนักศึกษา เช่น 6401234" value="6801234" />
        </div>
        
        <div class="form-group">
          <label for="student-course">หลักสูตร / สาขาวิชา (Course)</label>
          <input type="text" id="student-course" placeholder="ระบุหลักสูตร เช่น เทคโนโลยีสารสนเทศ" value="หลักสูตรเทคโนโลยีสารสนเทศ" />
        </div>

        <button id="btn-send-card" class="action-btn primary-btn">
          <span class="btn-icon">📤</span> ส่งนามบัตรเข้าห้องแชท (Send My Card)
        </button>
      </section>

      <!-- Section 2: Share Coach Card -->
      <section class="card-section glass-panel">
        <div class="panel-header">
          <span class="panel-icon">👨‍🏫</span>
          <h2>นามบัตร อ.เณร (Static Card)</h2>
        </div>
        
        <div class="coach-preview-card">
          <img src="https://wutthipong.info/wp-content/uploads/2021/07/nen.jpg" onerror="this.src='https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&q=80&w=250'" alt="อ.เณร" class="coach-img" />
          <div class="coach-info">
            <h3>วุฒิพงษ์ ชินศรี</h3>
            <p>อาจารย์ ม.รังสิต</p>
            <a href="https://wutthipong.info" target="_blank" class="coach-link">wutthipong.info 🌐</a>
          </div>
        </div>

        <button id="btn-share-coach" class="action-btn secondary-btn">
          <span class="btn-icon">🔗</span> แชร์ให้เพื่อนใน LINE (Share Coach Card)
        </button>
      </section>

      <!-- Section 3: QR Code Scanner -->
      <section class="card-section glass-panel">
        <div class="panel-header">
          <span class="panel-icon">🔍</span>
          <h2>เครื่องมือสแกน (QR Scanner)</h2>
        </div>
        
        <button id="btn-scan-qr" class="action-btn scan-btn">
          <span class="btn-icon">📷</span> สแกน QR Code
        </button>
        
        <div id="scan-result-wrapper" class="scan-result hidden">
          <label>ผลลัพธ์การสแกน:</label>
          <div id="scan-result-text" class="result-text">ไม่มีข้อมูล</div>
          <div class="result-actions">
            <button id="btn-copy-result" class="mini-btn">คัดลอกข้อความ</button>
            <button id="btn-send-result-chat" class="mini-btn success-btn">ส่งเข้าห้องแชท</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Footer credit -->
    <footer class="app-footer">
      <p>Final Exam App • Powered by LIFF SDK</p>
    </footer>

  </div>

  <!-- LINE LIFF SDK & Main logic -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
